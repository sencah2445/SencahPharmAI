<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SencahPharmAI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      line-height: 1.6;
    }

    .chat-box {
      margin-top: 24px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 16px;
      background: #fafafa;
      min-height: 250px;
      max-height: 400px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      max-width: 80%;
    }

    .bot {
      background: #e0ecff;
    }

    .user {
      background: #dcfce7;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #1d4ed8;
    }

    .small {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>SencahPharmAI</h1>
      <p>Your South African pharmacy study assistant.</p>
      <p>Exam prep, clinical reasoning, drug interactions, and answers aligned with SA guidelines.</p>

      <div class="chat-box" id="chatBox">
        <div class="message bot">Hello 👋 I am SencahPharmAI. Ask me a pharmacy question.</div>
      </div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your question here..." />
        <button onclick="sendMessage()">Send</button>
      </div>

      <div class="small">
        Demo version only — AI connection coming next.
      </div>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const userText = input.value.trim();

      if (userText === "") return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = userText;
      chatBox.appendChild(userMessage);

      let reply = "I am still in demo mode. Real AI connection will be added next.";

      const lowerText = userText.toLowerCase();

      if (lowerText.includes("metformin")) {
        reply = "Metformin mainly reduces hepatic glucose production and improves insulin sensitivity.";
      } else if (lowerText.includes("amoxicillin")) {
        reply = "Amoxicillin is a penicillin antibiotic used to treat susceptible bacterial infections.";
      } else if (lowerText.includes("paracetamol")) {
        reply = "Paracetamol is commonly used for pain and fever relief.";
      } else if (lowerText.includes("hello") || lowerText.includes("hi")) {
        reply = "Hello 👋 Ask me anything about pharmacy studies.";
      }

      const botMessage = document.createElement("div");
      botMessage.className = "message bot";
      botMessage.textContent = reply;

      setTimeout(() => {
        chatBox.appendChild(botMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);

      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
